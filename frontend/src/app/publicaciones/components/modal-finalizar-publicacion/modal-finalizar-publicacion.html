<div mat-dialog-title class="d-flex justify-content-between align-items-center">
  <h4>Finalizar publicación</h4>
  <button type="button" mat-icon-button aria-label="Cerrar" (click)="cancel()">
    <mat-icon>close</mat-icon>
  </button>
</div>

<mat-dialog-content>
  <p>¿Está seguro de finalizar la publicación? Ya no se va a poder volver a activar.</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button type="button" mat-button (click)="cancel()">Cancelar</button>
  <button type="submit" mat-flat-button color="primary" (click)="ok()">Aceptar</button>
</mat-dialog-actions>
